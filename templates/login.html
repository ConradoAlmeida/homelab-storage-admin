{% extends "base_auth.html" %}
{% block title %}Entrar - {{ product_name }}{% endblock %}
{% block content %}
<div class="card login-box">
  <h1>Entrar</h1>
  {% if erro %}<p class="errorlist">{{ erro }}</p>{% elif form.errors %}<p class="errorlist">Usuário ou senha inválidos.</p>{% endif %}
  <form class="stack" method="post">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <div>
      <label for="id_username">Usuário</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
    </div>
    <div>
      <label for="id_password">Senha</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
