{% extends "base.html" %}
{% block title %}Entrar - Homelab Storage{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>Entrar</h1>
  {% if form.errors %}<p class="errorlist">Usuário ou senha inválidos.</p>{% endif %}
  <form class="stack" method="post">
    {% csrf_token %}
    <div>
      <label for="id_username">Usuário</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
    </div>
    <div>
      <label for="id_password">Senha</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
