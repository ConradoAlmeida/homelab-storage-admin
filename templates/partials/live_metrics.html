<script>
(function () {
  const endpoint = "{% url 'live_metrics' %}";
  let busy = false;

  function setText(element, value) {
    if (element) element.textContent = value;
  }

  function updateZones(system) {
    const zones = system.zones || [];
    document.querySelectorAll("[data-live-zone]").forEach((card) => {
      const zone = zones[Number(card.dataset.liveZone)];
      const target = card.querySelector("[data-live-zone-value]");
      if (!zone || !target) return;
      const temp = zone.temp === null || zone.temp === undefined
        ? "—"
        : Number(zone.temp).toFixed(1) + " °C";
      const isCpu = (zone.type || "").includes("cpu");
      if (isCpu && system.cpu_percent !== null && system.cpu_percent !== undefined) {
        target.textContent = temp + " · " + Number(system.cpu_percent).toFixed(1) + "%";
      } else {
        target.textContent = temp;
      }
    });
  }

  function updateFans(system) {
    const fans = system.fans || [];
    document.querySelectorAll("[data-live-fan]").forEach((card) => {
      const fan = fans[Number(card.dataset.liveFan)];
      if (!fan) return;
      const value = card.querySelector("[data-live-fan-value]");
      const sub = card.querySelector("[data-live-fan-sub]");
      if (value) {
        if (fan.rpm === null || fan.rpm === undefined) {
          value.textContent = "—";
        } else {
          value.textContent = fan.rpm + " rpm" + (fan.rpm === 0 ? " (parado)" : "");
        }
      }
      if (sub) {
        sub.textContent = "PWM " + (fan.pwm_percent === null || fan.pwm_percent === undefined
          ? "—"
          : fan.pwm_percent + "%") + (fan.rpm === 0 ? " · curva começa ~50 °C" : "");
      }
    });
  }

  function updateSystem(system) {
    updateZones(system);
    updateFans(system);
    const load = system.load || {};
    const loadTarget = document.querySelector("[data-live-load]");
    if (loadTarget) {
      loadTarget.textContent = [load.l1, load.l5, load.l15]
        .map((value) => value === null || value === undefined ? "—" : Number(value).toFixed(2))
        .join(" / ");
    }
    const available = system.mem_available_mb;
    const total = system.mem_total_mb;
    setText(
      document.querySelector("[data-live-mem-available]"),
      available === null || available === undefined ? "—" : String(available)
    );
    setText(
      document.querySelector("[data-live-mem-total]"),
      total === null || total === undefined ? "—" : String(total)
    );
  }

  async function tick() {
    if (busy || document.hidden) return;
    busy = true;
    try {
      const response = await fetch(endpoint, {
        headers: {"Accept": "application/json"},
        cache: "no-store"
      });
      if (!response.ok) throw new Error("http");
      const data = await response.json();
      updateSystem(data.system || {});
    } catch (error) {
      // Mantém o último valor; o restante da página continua utilizável.
    } finally {
      busy = false;
    }
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
