{% load static %}
{% if brand_homelab %}
<link rel="icon" href="{% static 'images/conradhub/favicon.ico' %}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/conradhub/favicon-32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/conradhub/favicon-16.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/conradhub/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'images/conradhub/site.webmanifest' %}">
<meta name="theme-color" content="#10131c">
<meta name="apple-mobile-web-app-title" content="Conradhub Homelab">
{% else %}
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32.png' %}">
{% endif %}
