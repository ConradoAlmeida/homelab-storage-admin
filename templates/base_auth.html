<!doctype html>
{% load static %}
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ product_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/ui.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/kit.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'vendor/moya-ui/login.css' %}?v=20261114a">
  {% include "partials/brand_icons.html" %}
</head>
<body class="auth-body">
  <main id="main" class="auth-card">
    {% include "partials/messages.html" %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
