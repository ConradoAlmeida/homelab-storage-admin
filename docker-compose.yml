services:
  web:
    build: .
    container_name: homelab-storage-admin
    restart: unless-stopped
    # Bind apenas na LAN. Se o IP do Pi mudar, ajuste aqui e no .env.
    ports:
      - "192.168.0.150:8060:8000"
    env_file:
      - .env
    environment:
      - AGENT_SOCKET=/run/homelab-storage-admin/agent.sock
    volumes:
      - /mnt/nas/apps/homelab-storage-admin/data:/app/data
      - /mnt/nas:/mnt/nas:ro
      - /run/homelab-storage-admin:/run/homelab-storage-admin:ro
