services:
  web:
    build: .
    container_name: homelab-storage-admin
    restart: unless-stopped
    # O perfil do host define BIND_ADDR/BIND_PORT; o default nao expoe na LAN.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BIND_PORT:-8060}:8000"
    env_file:
      - .env
    environment:
      - AGENT_SOCKET=${AGENT_SOCKET:-/run/homelab-storage-admin/agent.sock}
      - TERMINAL_SOCKET=${TERMINAL_SOCKET:-/run/homelab-storage-admin/terminal.sock}
      - SITE_NAME=${SITE_NAME:-Homelab Storage}
      - STORAGE_ROOT=${STORAGE_ROOT:-/mnt/nas}
      - SNAPSHOT_ROOT=${SNAPSHOT_ROOT:-/mnt/nas/.snapshots}
      - ALLOWED_PATH_PREFIXES=${ALLOWED_PATH_PREFIXES:-/mnt/nas/}
      - DF_MOUNTS=${DF_MOUNTS:-/,/mnt/nas}
      - BACKUP_ROOT=${BACKUP_ROOT:-/mnt/backup}
      - JELLYFIN_ROOT=${JELLYFIN_ROOT:-/mnt/jellyfin}
      - SNAPSHOT_BACKEND=${SNAPSHOT_BACKEND:-auto}
      - SNAPSHOT_DENYLIST=${SNAPSHOT_DENYLIST:-}
      - CREDENTIALS_MANAGE_USERS=${CREDENTIALS_MANAGE_USERS:-0}
      - FIREWALL_MANAGE=${FIREWALL_MANAGE:-1}
      - SYSTEM_MANAGE=${SYSTEM_MANAGE:-1}
      - TERMINAL_ENABLE=${TERMINAL_ENABLE:-1}
      - TORRENT_API_TOKEN=${TORRENT_API_TOKEN:-}
      - SSH_LOGIN=${SSH_LOGIN:-}
      - SHARE_OWNER=${SHARE_OWNER:-conrado}
      - HOST_ENV_PATH=${HOST_ENV_PATH:-/etc/homelab-storage-admin/host.env}
      - STACK_ENV_PATH=${STACK_ENV_PATH:-/opt/stacks/homelab-storage-admin/.env}
      - SERVICES_INI_HOST=${SERVICES_INI_HOST:-${DATA_DIR:-./data}/services.ini}
      - CREDENCIAIS_ENV=${CREDENCIAIS_ENV:-}
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
      - "${STORAGE_ROOT:-/mnt/nas}:${STORAGE_ROOT:-/mnt/nas}:ro"
      - "${AGENT_SOCKET_DIR:-/run/homelab-storage-admin}:/run/homelab-storage-admin:ro"
