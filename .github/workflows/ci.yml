name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sincronizar dependencias
        run: uv sync --dev --frozen
      - name: Django check
        run: uv run manage.py check
      - name: Migracoes em dia
        run: uv run manage.py makemigrations --check --dry-run
      - name: CSS do kit compilado
        # frontend/src.css -> static/css/kit.css e versionado; esquecer o build
        # faz a mudanca de estilo sumir no host sem nenhum aviso.
        run: |
          uv run manage.py tailwind build
          git diff --exit-code -- static/css/kit.css
      - name: Scripts de shell
        # Os quatro scripts que rodam como root no host: sintaxe + shellcheck
        # em nivel warning (info fica de fora para nao virar ruido).
        run: |
          command -v shellcheck >/dev/null ||
            (sudo apt-get update && sudo apt-get install -y shellcheck)
          bash -n deploy.sh entrypoint.sh install-agent.sh scripts/stacks/apps-sync.sh
          shellcheck --severity=warning --shell=bash \
            deploy.sh entrypoint.sh install-agent.sh scripts/stacks/apps-sync.sh
      - name: Testes
        run: uv run pytest

  imagem-arm64:
    # O Pi e arm64: qemu custa minutos, entao so no push para main (PR fica
    # rapido) e sem publicar imagem.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem para o Pi
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: homelab-storage-admin:arm64
