name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sincronizar dependencias
        run: uv sync --dev --frozen
      - name: Django check
        run: uv run manage.py check
      - name: Testes
        run: uv run pytest
