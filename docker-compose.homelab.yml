# Overlay do Pi (homelab). Mantem os caminhos atuais do /mnt/nas.
# Use junto com host.env: deploy.sh carrega /etc/homelab-storage-admin/host.env.
services:
  web:
    environment:
      QBITTORRENT_URL: http://qbittorrent:8090
    extra_hosts:
      - "qbittorrent:host-gateway"
    depends_on:
      - qbittorrent
    volumes:
      - /mnt/nas/apps/homelab-storage-admin/data:/app/data
      - /mnt/nas:/mnt/nas:ro
      - ${JELLYFIN_ROOT:-/mnt/jellyfin}:${JELLYFIN_ROOT:-/mnt/jellyfin}:ro
      - /run/homelab-storage-admin:/run/homelab-storage-admin:ro
  # Download de mídia para o Jellyfin. A rede é a do Pi, para o handshake
  # dos peers sair como num cliente instalado no host. A WebUI fica na 8090:
  # a 8080 deste Pi já está ocupada. O painel alcança esse nome pelo
  # host-gateway; a LAN não recebe regra para a 8090. PGID 1024 é o grupo
  # jellyfin deste Pi.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: host
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1024"
      TZ: America/Sao_Paulo
      WEBUI_PORT: "8090"
      TORRENTING_PORT: "6881"
    volumes:
      - /mnt/nas/apps/qbittorrent/config:/config
      - ${JELLYFIN_ROOT:-/mnt/jellyfin}:${JELLYFIN_ROOT:-/mnt/jellyfin}
    stop_grace_period: 30s
