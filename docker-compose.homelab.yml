# Overlay do Pi (homelab). Mantem os caminhos atuais do /mnt/nas.
# Use junto com host.env: deploy.sh carrega /etc/homelab-storage-admin/host.env.
services:
  web:
    volumes:
      - /mnt/nas/apps/homelab-storage-admin/data:/app/data
      - /mnt/nas:/mnt/nas:ro
      - ${JELLYFIN_ROOT:-/mnt/jellyfin}:${JELLYFIN_ROOT:-/mnt/jellyfin}:ro
      - /run/homelab-storage-admin:/run/homelab-storage-admin:ro
